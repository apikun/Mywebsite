<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Apikuun's Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
}

/* iOS 6 wallpaper — deep blue gradient with subtle noise */
body {
  background:
    radial-gradient(ellipse at 50% 0%, #4a7fd4 0%, #1a4a8a 40%, #0a1f4a 100%);
  min-height: 100vh;
}

/* Subtle grain overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.04'/></svg>");
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

/* =========================================================
   iOS 6 Status bar area
   ========================================================= */
#statusbar {
  height: 20px;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: bold;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.5px;
  text-shadow: 0 1px 1px rgba(0,0,0,0.5);
  flex-shrink: 0;
}

/* =========================================================
   Header — iOS 6 steel nav bar
   ========================================================= */
#header {
  flex-shrink: 0;
  position: relative;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(180deg,
      #e8ecf0 0%,
      #d0d5db 48%,
      #b8bec6 50%,
      #a0a8b2 100%);
  border-bottom: 1px solid #4a5058;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.85),
    inset 0 -1px 2px rgba(0,0,0,0.2),
    0 2px 6px rgba(0,0,0,0.4);
}

#header-title {
  font-size: 17px;
  font-weight: bold;
  color: #1a2230;
  text-shadow: 0 1px 0 rgba(255,255,255,0.7);
  letter-spacing: 0.2px;
}

/* =========================================================
   Scroll area
   ========================================================= */
#scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 30px 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

/* =========================================================
   Profile / greeting card — leather stitched
   ========================================================= */
#profile-card {
  width: 100%;
  border-radius: 14px;
  padding: 18px 16px;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.06), transparent 60%),
    linear-gradient(135deg, #5a3a1a 0%, #3a2010 50%, #2a1508 100%);
  border: 1px solid #1a0f05;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -2px 4px rgba(0,0,0,0.5),
    0 4px 12px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}

/* Stitching */
#profile-card::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px dashed rgba(255,255,255,0.2);
  border-radius: 10px;
  pointer-events: none;
}

#profile-avatar {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 55%),
    linear-gradient(135deg, #ff9a4a 0%, #ff6600 50%, #cc4400 100%);
  border: 2px solid #6a2a00;
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.6),
    0 3px 6px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  color: #fff;
  font-family: Georgia, serif;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}
#profile-avatar::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px; right: 2px;
  height: 40%;
  border-radius: 10px 10px 16px 16px;
  background: linear-gradient(180deg, rgba(255,255,255,0.5), transparent);
  pointer-events: none;
}

#profile-name {
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  position: relative;
  z-index: 1;
}

#profile-sub {
  font-size: 12px;
  color: rgba(255,220,170,0.8);
  text-shadow: 0 1px 1px rgba(0,0,0,0.6);
  margin-top: 3px;
  position: relative;
  z-index: 1;
}

/* =========================================================
   Section label
   ========================================================= */
.section-label {
  width: 100%;
  font-size: 13px;
  font-weight: bold;
  color: rgba(255,255,255,0.6);
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding-left: 4px;
  margin-bottom: -16px;
}

/* =========================================================
   App list — iOS 6 grouped table style
   ========================================================= */
.app-list {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #3a4050;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 3px 10px rgba(0,0,0,0.4);
}

.app-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: background 0.1s ease;
  position: relative;
}

.app-item:last-child {
  border-bottom: none;
}

.app-item:active {
  background:
    linear-gradient(180deg, #2a5fd4 0%, #1a4ab0 50%, #0d3a8a 51%, #0a2d6e 100%);
}

/* iOS 6 style chevron */
.app-item::after {
  content: "›";
  position: absolute;
  right: 14px;
  font-size: 22px;
  color: rgba(255,255,255,0.35);
  font-weight: 300;
  line-height: 1;
}

/* App icon */
.app-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  position: relative;
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.5),
    0 2px 5px rgba(0,0,0,0.5);
  border: 1px solid rgba(0,0,0,0.3);
}

/* Gloss shine on icon */
.app-icon::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px; right: 2px;
  height: 42%;
  border-radius: 9px 9px 16px 16px;
  background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0));
  pointer-events: none;
}

.app-icon.orange {
  background: linear-gradient(180deg, #ffaa55 0%, #ff6600 50%, #cc3300 100%);
}
.app-icon.blue {
  background: linear-gradient(180deg, #5599ff 0%, #2266dd 50%, #0044aa 100%);
}
.app-icon.green {
  background: linear-gradient(180deg, #66cc44 0%, #33aa11 50%, #227700 100%);
}
.app-icon.purple {
  background: linear-gradient(180deg, #aa66dd 0%, #7733bb 50%, #551199 100%);
}

.app-info {
  flex: 1;
  min-width: 0;
  padding-right: 20px;
}

.app-name {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

.app-desc {
  font-size: 12px;
  color: rgba(200,220,255,0.65);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================================================
   iOS 6 dock at bottom
   ========================================================= */
#dock {
  flex-shrink: 0;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 0 20px 8px;
  background:
    linear-gradient(180deg,
      rgba(255,255,255,0.1) 0%,
      rgba(255,255,255,0.18) 100%);
  border-top: 1px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.dock-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  position: relative;
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.5),
    0 3px 8px rgba(0,0,0,0.6);
  border: 1px solid rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.1s ease;
  text-decoration: none;
}
.dock-icon:active { transform: scale(0.9); }
.dock-icon::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px; right: 2px;
  height: 42%;
  border-radius: 11px 11px 18px 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
  pointer-events: none;
}

.dock-icon.hn {
  background: linear-gradient(180deg, #ffaa55 0%, #ff6600 50%, #cc3300 100%);
}
.dock-icon.safari {
  background: linear-gradient(180deg, #55aaff 0%, #2277ee 50%, #0044bb 100%);
}
</style>
</head>
<body>
<div id="app">
  <div id="statusbar">Apikuun's Hub</div>

  <div id="header">
    <span id="header-title">My Hub</span>
  </div>

  <div id="scroll">

    <!-- Profile card -->
    <div id="profile-card">
      <div id="profile-avatar">A</div>
      <div id="profile-name">Apikuun</div>
      <div id="profile-sub">Developer · Thailand 🇹🇭</div>
    </div>

    <div class="section-label">Apps</div>

    <!-- App list -->
    <div class="app-list">
      <a class="app-item" href="https://apikun.github.io/Mywebsite/" target="_blank" rel="noopener">
        <div class="app-icon orange">Y</div>
        <div class="app-info">
          <div class="app-name">Hacker News</div>
          <div class="app-desc">iOS 3 style HN reader</div>
        </div>
      </a>
    </div>

    <div class="section-label">More coming soon</div>

    <div class="app-list">
      <div class="app-item" style="opacity:0.4; cursor:default;">
        <div class="app-icon blue">?</div>
        <div class="app-info">
          <div class="app-name">Next Project</div>
          <div class="app-desc">Something cool is cooking...</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Dock -->
  <div id="dock">
    <a class="dock-icon hn" href="https://apikun.github.io/Mywebsite/" target="_blank" rel="noopener">Y</a>
    <a class="dock-icon safari" href="https://github.com/apikun" target="_blank" rel="noopener">🐙</a>
  </div>
</div>
</body>
</html>
